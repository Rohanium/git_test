<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRJ Knowledge Base</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="chat-header">
    <div class="header-left">
      <div class="logo">S</div>
      <span class="header-title">Knowledge Base</span>
    </div>
    <div class="header-right">
      <a href="/admin.html" class="header-link">Admin</a>
      <button id="new-chat-btn" class="new-chat-btn">New Chat</button>
    </div>
  </header>

  <main class="chat-container">
    <div id="messages" class="messages">
      <div class="message bot">
        <div class="msg-content">Hi! Ask me anything about the uploaded knowledge base.</div>
      </div>
    </div>

    <div class="chat-input-wrap">
      <form id="chat-form" class="chat-input">
        <input
          type="text"
          id="user-input"
          placeholder="Type your message..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    const history = [];

    // New chat button
    document.getElementById("new-chat-btn").addEventListener("click", () => {
      history.length = 0;
      messagesEl.innerHTML = `
        <div class="message bot">
          <div class="msg-content">Hi! Ask me anything about the uploaded knowledge base.</div>
        </div>`;
      input.focus();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";
      sendBtn.disabled = true;
      sendBtn.textContent = "...";

      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json();

        if (data.reply) {
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: data.reply });
          appendMessage("bot", data.reply);
        } else {
          appendMessage("bot", "Error: " + (data.error || "Something went wrong."));
        }
      } catch {
        appendMessage("bot", "Network error. Please try again.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        input.focus();
      }
    });

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;

      const content = document.createElement("div");
      content.className = "msg-content";

      if (role === "bot") {
        content.innerHTML = marked.parse(text);
      } else {
        content.textContent = text;
      }

      div.appendChild(content);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  </script>
</body>
</html>
