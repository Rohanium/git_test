<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRJ Knowledge Base</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c4956a" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Sidebar */
    .app-layout { display: flex; height: 100vh; }
    .sidebar {
      width: 260px;
      background: #f7f7f8;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header span {
      font-weight: 600;
      font-size: 0.9rem;
      color: #333;
    }
    .sidebar-new-btn {
      padding: 0.3rem 0.75rem;
      background: #c4956a;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
    }
    .sidebar-new-btn:hover { background: #b5845c; }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .sidebar-item {
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .sidebar-item:hover { background: #eee; }
    .sidebar-item.active {
      background: #fff;
      color: #1a1a1a;
      font-weight: 500;
      border-left-color: #c4956a;
    }
    .sidebar-item .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .sidebar-item .delete-chat {
      opacity: 0;
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 0.25rem;
      transition: opacity 0.15s;
    }
    .sidebar-item:hover .delete-chat { opacity: 1; }
    .sidebar-item .delete-chat:hover { color: #c62828; }
    .sidebar-empty {
      padding: 1rem;
      color: #999;
      font-size: 0.85rem;
      text-align: center;
    }
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    /* Toggle for mobile */
    .sidebar-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #555;
      padding: 0.25rem;
    }
    @media (max-width: 700px) {
      .sidebar { position: fixed; left: -270px; top: 0; bottom: 0; z-index: 50; transition: left 0.25s; }
      .sidebar.open { left: 0; box-shadow: 2px 0 8px rgba(0,0,0,0.15); }
      .sidebar-toggle { display: block; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Chat History</span>
        <button class="sidebar-new-btn" id="new-chat-btn">+ New</button>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-empty">No conversations yet</div>
      </div>
    </aside>

    <!-- Main panel -->
    <div class="main-panel">
      <header class="chat-header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebar-toggle">&#9776;</button>
          <div class="logo">S</div>
          <span class="header-title">Knowledge Base</span>
        </div>
        <div class="header-right">
          <a href="/admin.html" class="header-link">Admin</a>
        </div>
      </header>

      <main class="chat-container">
        <div id="messages" class="messages">
          <div class="message bot">
            <div class="msg-content">Hi! Ask me anything about the uploaded knowledge base.</div>
          </div>
        </div>

        <div class="chat-input-wrap">
          <form id="chat-form" class="chat-input">
            <input
              type="text"
              id="user-input"
              placeholder="Type your message..."
              autocomplete="off"
              required
            />
            <button type="submit" id="send-btn">Send</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const sidebarList = document.getElementById("sidebar-list");
    const sidebar = document.getElementById("sidebar");

    // Chat state
    let history = [];
    let currentChatId = null;
    let chats = JSON.parse(localStorage.getItem("srj-chats") || "[]");

    // Mobile sidebar toggle
    document.getElementById("sidebar-toggle").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    // New chat
    document.getElementById("new-chat-btn").addEventListener("click", () => {
      startNewChat();
      sidebar.classList.remove("open");
    });

    function startNewChat() {
      currentChatId = null;
      history = [];
      messagesEl.innerHTML = `
        <div class="message bot">
          <div class="msg-content">Hi! Ask me anything about the uploaded knowledge base.</div>
        </div>`;
      input.focus();
      renderSidebar();
    }

    function saveChat() {
      if (history.length === 0) return;

      const title = history[0]?.content?.slice(0, 50) || "New chat";

      if (currentChatId) {
        const idx = chats.findIndex((c) => c.id === currentChatId);
        if (idx !== -1) {
          chats[idx].history = [...history];
          chats[idx].title = title;
        }
      } else {
        currentChatId = Date.now().toString();
        chats.unshift({ id: currentChatId, title, history: [...history] });
      }

      localStorage.setItem("srj-chats", JSON.stringify(chats));
      renderSidebar();
    }

    function loadChat(id) {
      const chat = chats.find((c) => c.id === id);
      if (!chat) return;

      currentChatId = id;
      history = [...chat.history];

      messagesEl.innerHTML = "";
      for (const msg of history) {
        appendMessage(msg.role === "user" ? "user" : "bot", msg.content, false);
      }

      renderSidebar();
      sidebar.classList.remove("open");
      input.focus();
    }

    function deleteChat(id) {
      chats = chats.filter((c) => c.id !== id);
      localStorage.setItem("srj-chats", JSON.stringify(chats));
      if (currentChatId === id) startNewChat();
      else renderSidebar();
    }

    function renderSidebar() {
      if (chats.length === 0) {
        sidebarList.innerHTML = '<div class="sidebar-empty">No conversations yet</div>';
        return;
      }
      sidebarList.innerHTML = chats
        .map(
          (c) =>
            `<div class="sidebar-item${c.id === currentChatId ? " active" : ""}" data-id="${c.id}">
              <span class="title">${escapeHtml(c.title)}</span>
              <button class="delete-chat" data-id="${c.id}">&times;</button>
            </div>`
        )
        .join("");

      sidebarList.querySelectorAll(".sidebar-item").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.classList.contains("delete-chat")) return;
          loadChat(el.dataset.id);
        });
      });

      sidebarList.querySelectorAll(".delete-chat").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteChat(btn.dataset.id);
        });
      });
    }

    // Submit message
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";
      sendBtn.disabled = true;
      sendBtn.textContent = "...";

      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json();

        if (data.reply) {
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: data.reply });
          appendMessage("bot", data.reply);
          saveChat();
        } else {
          appendMessage("bot", "Error: " + (data.error || "Something went wrong."));
        }
      } catch {
        appendMessage("bot", "Network error. Please try again.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        input.focus();
      }
    });

    function appendMessage(role, text, animate = true) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      if (!animate) div.style.animation = "none";

      const content = document.createElement("div");
      content.className = "msg-content";

      if (role === "bot") {
        content.innerHTML = marked.parse(text);
      } else {
        content.textContent = text;
      }

      div.appendChild(content);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // Init
    renderSidebar();
  </script>
</body>
</html>
