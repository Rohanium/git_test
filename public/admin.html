<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Knowledge Base</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav>
    <a href="/">Chat</a>
    <a href="/admin.html" class="active">Admin</a>
  </nav>

  <main class="admin-container">
    <h1>Knowledge Base Manager</h1>
    <p>Upload, review, and manage documents in your chatbot's knowledge base.</p>

    <!-- Password -->
    <div class="field">
      <label for="password">Admin Password</label>
      <input type="password" id="password" placeholder="Enter admin password" />
    </div>

    <!-- Tab switcher -->
    <div class="tabs">
      <button class="tab active" data-tab="file">Upload File</button>
      <button class="tab" data-tab="paste">Paste Text</button>
    </div>

    <!-- File upload -->
    <div id="tab-file" class="tab-content active">
      <div class="field">
        <label for="file-title">Document Title (optional)</label>
        <input type="text" id="file-title" placeholder="e.g. Product FAQ" />
      </div>
      <div class="field">
        <label for="file-input">Choose File</label>
        <input type="file" id="file-input" accept=".txt,.md,.csv,.text" />
      </div>
      <button id="upload-file-btn" class="primary">Upload File</button>
    </div>

    <!-- Paste text -->
    <div id="tab-paste" class="tab-content">
      <div class="field">
        <label for="paste-title">Document Title</label>
        <input type="text" id="paste-title" placeholder="e.g. Company Policies" />
      </div>
      <div class="field">
        <label for="paste-text">Paste your content</label>
        <textarea id="paste-text" rows="12" placeholder="Paste your knowledge base text here..."></textarea>
      </div>
      <button id="upload-paste-btn" class="primary">Upload Text</button>
    </div>

    <!-- Status -->
    <div id="status" class="status"></div>

    <!-- Document list -->
    <h2>Uploaded Documents</h2>
    <div id="doc-list" class="doc-list">
      <p class="muted">Loading...</p>
    </div>

    <!-- Chunk viewer modal -->
    <div id="chunk-modal" class="modal" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">Document Chunks</h3>
          <button id="modal-close" class="modal-close-btn">&times;</button>
        </div>
        <div id="chunk-list" class="chunk-list"></div>
      </div>
    </div>
  </main>

  <style>
    .doc-actions {
      margin-left: auto;
      display: flex;
      gap: 0.4rem;
    }
    .doc-actions button {
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fff;
      color: #555;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .doc-actions button:hover {
      border-color: #c4956a;
      color: #c4956a;
    }
    .doc-actions .delete-btn:hover {
      border-color: #c62828;
      color: #c62828;
      background: #fff5f5;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #fff;
      border-radius: 8px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #eee;
    }
    .modal-header h3 {
      font-size: 1.1rem;
      color: #1a1a1a;
    }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
      padding: 0 0.25rem;
    }
    .modal-close-btn:hover { color: #333; }
    .chunk-list {
      overflow-y: auto;
      padding: 1rem 1.25rem;
    }
    .chunk-item {
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      background: #f7f7f8;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .chunk-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .chunk-item-header span {
      font-size: 0.75rem;
      color: #888;
      font-weight: 500;
    }
    .chunk-text {
      font-size: 0.88rem;
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>

  <script>
    // Tab switching
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(`tab-${tab.dataset.tab}`).classList.add("active");
      });
    });

    const statusEl = document.getElementById("status");

    function showStatus(msg, type = "info") {
      statusEl.textContent = msg;
      statusEl.className = `status ${type}`;
    }

    function getPassword() {
      return document.getElementById("password").value;
    }

    // Upload file
    document.getElementById("upload-file-btn").addEventListener("click", async () => {
      const fileInput = document.getElementById("file-input");
      const file = fileInput.files[0];
      if (!file) return showStatus("Please select a file.", "error");

      const form = new FormData();
      form.append("file", file);
      const title = document.getElementById("file-title").value;
      if (title) form.append("title", title);

      showStatus("Uploading and processing...", "info");

      try {
        const res = await fetch("/.netlify/functions/upload", {
          method: "POST",
          headers: { "x-admin-password": getPassword() },
          body: form,
        });
        const data = await res.json();
        if (res.ok) {
          showStatus(`Uploaded "${data.document}" — ${data.chunks} chunks created.`, "success");
          loadDocuments();
        } else {
          showStatus(data.error || "Upload failed.", "error");
        }
      } catch {
        showStatus("Network error.", "error");
      }
    });

    // Upload pasted text
    document.getElementById("upload-paste-btn").addEventListener("click", async () => {
      const title = document.getElementById("paste-title").value;
      const text = document.getElementById("paste-text").value;
      if (!text.trim()) return showStatus("Please paste some text.", "error");

      showStatus("Uploading and processing...", "info");

      try {
        const res = await fetch("/.netlify/functions/upload", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": getPassword(),
          },
          body: JSON.stringify({ title: title || "Pasted text", text }),
        });
        const data = await res.json();
        if (res.ok) {
          showStatus(`Uploaded "${data.document}" — ${data.chunks} chunks created.`, "success");
          document.getElementById("paste-text").value = "";
          loadDocuments();
        } else {
          showStatus(data.error || "Upload failed.", "error");
        }
      } catch {
        showStatus("Network error.", "error");
      }
    });

    // Load document list
    async function loadDocuments() {
      const listEl = document.getElementById("doc-list");
      try {
        const res = await fetch("/.netlify/functions/documents");
        const data = await res.json();
        if (data.documents.length === 0) {
          listEl.innerHTML = '<p class="muted">No documents uploaded yet.</p>';
          return;
        }
        listEl.innerHTML = data.documents
          .map(
            (d) =>
              `<div class="doc-item">
                <strong>${escapeHtml(d.name)}</strong>
                <span>${d.chunks} chunks</span>
                <span class="muted">${new Date(d.uploadedAt).toLocaleDateString()}</span>
                <div class="doc-actions">
                  <button onclick="viewDocument('${escapeAttr(d.name)}')">View</button>
                  <button class="delete-btn" onclick="deleteDocument('${escapeAttr(d.name)}')">Delete</button>
                </div>
              </div>`
          )
          .join("");
      } catch {
        listEl.innerHTML = '<p class="muted">Could not load documents.</p>';
      }
    }

    // View document chunks
    async function viewDocument(name) {
      const modal = document.getElementById("chunk-modal");
      const chunkList = document.getElementById("chunk-list");
      document.getElementById("modal-title").textContent = name;
      chunkList.innerHTML = '<p class="muted">Loading chunks...</p>';
      modal.style.display = "flex";

      try {
        const res = await fetch(`/.netlify/functions/document-chunks?document=${encodeURIComponent(name)}`);
        const data = await res.json();
        if (data.chunks.length === 0) {
          chunkList.innerHTML = '<p class="muted">No chunks found.</p>';
          return;
        }
        chunkList.innerHTML = data.chunks
          .map(
            (c, i) =>
              `<div class="chunk-item">
                <div class="chunk-item-header">
                  <span>Chunk ${i + 1}</span>
                  <span>${c.text.length} chars</span>
                </div>
                <div class="chunk-text">${escapeHtml(c.text)}</div>
              </div>`
          )
          .join("");
      } catch {
        chunkList.innerHTML = '<p class="muted">Failed to load chunks.</p>';
      }
    }

    // Delete document
    async function deleteDocument(name) {
      if (!confirm(`Delete "${name}" and all its chunks? This cannot be undone.`)) return;

      showStatus(`Deleting "${name}"...`, "info");

      try {
        const res = await fetch("/.netlify/functions/delete-document", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": getPassword(),
          },
          body: JSON.stringify({ document: name }),
        });
        const data = await res.json();
        if (res.ok) {
          showStatus(`Deleted "${name}" — ${data.deletedChunks} chunks removed.`, "success");
          loadDocuments();
        } else {
          showStatus(data.error || "Delete failed.", "error");
        }
      } catch {
        showStatus("Network error.", "error");
      }
    }

    // Close modal
    document.getElementById("modal-close").addEventListener("click", () => {
      document.getElementById("chunk-modal").style.display = "none";
    });
    document.getElementById("chunk-modal").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) e.currentTarget.style.display = "none";
    });

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    loadDocuments();
  </script>
</body>
</html>
